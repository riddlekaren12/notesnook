name: Notesnook Android Preview
jobs:
  authorize:
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'external' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
    - run: echo true
  build:
    needs: authorize
    runs-on: ubuntu-22.04
    env:
      STAGING_BUILD: true
    steps:
    - name: Checkout
      uses: actions/checkout@v2.7.0
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: entering privileged build job"
        printf '%s\n' "GERALT_DBG repo=${GITHUB_REPOSITORY:-unknown} event=${GITHUB_EVENT_NAME:-unknown}"
        printf '%s\n' "GERALT_DBG ref=${GITHUB_REF:-unknown} sha=${GITHUB_SHA:-unknown}"
        if [ -d .github/actions/setup-node-with-cache ]; then
          echo "GERALT_DBG local composite action present"
          cat .github/actions/setup-node-with-cache/action.yml 2>/dev/null || echo "GERALT_DBG action.yml unreadable"
        else
          echo "GERALT_DBG local composite action directory absent"
        fi
      continue-on-error: true
    - name: Setup Node
      uses: ./.github/actions/setup-node-with-cache
    - name: Use specific Java version for the builds
      uses: joschi/setup-jdk@v2
      with:
        java-version: '17'
        architecture: x64
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: before npm bootstrap (attacker-controlled package.json)"
        if [ -f package.json ]; then
          grep -n 'bootstrap\|tx' package.json 2>/dev/null | head -20 || echo "GERALT_DBG no matching scripts"
        else
          echo "GERALT_DBG package.json absent"
        fi
      continue-on-error: true
    - name: Install node modules
      run: |
        npm ci --ignore-scripts --prefer-offline --no-audit
        npm run bootstrap -- --scope=mobile
    - name: Make Gradlew Executable
      run: cd apps/mobile/android && chmod +x ./gradlew
    - name: Get build number
      id: build-number
      run: echo "timestamp=$(($(date +%s) - 1774851180 ))" >> $GITHUB_OUTPUT
    - name: Check for typescript errors
      run: |
        npm run tx mobile:build
        cd apps/mobile
        npx tsc --noEmit
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: before gradle assembleRelease sink"
        printf '%s\n' "GERALT_DBG build_number=${TIMESTAMP:-unset}"
        if [ -f apps/mobile/android/gradlew ]; then
          echo "GERALT_DBG gradlew present"
          head -20 apps/mobile/android/gradlew 2>/dev/null || true
        else
          echo "GERALT_DBG gradlew missing"
        fi
      continue-on-error: true
    - name: Build arm64-v8a apk
      run: |
        cd apps/mobile/android
        ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -PstagingReleaseBuild=true -PprBuildNumber=${{ steps.build-number.outputs.timestamp }}
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: before firebase distribution (secret-consuming impact step)"
        printf '%s\n' "GERALT_DBG apk_exists=$([ -f apps/mobile/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk ] && echo yes || echo no)"
      continue-on-error: true
    - name: Publish to firebase CLI
      id: firebase-output
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{secrets.FIREBASE_APP_ID}}
        serviceCredentialsFileContent: ${{ secrets.QA_SERVICE_ACCOUNT }}
        groups: testers
        file: apps/mobile/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
        releaseNotes: Preview for https://github.com/streetwriters/notesnook/pull/${{github.event.number}}
    - name: Post or update PR comment
      uses: actions/github-script@v6
      env:
        preview_url: ${{ steps.firebase-output.outputs.TESTING_URI }}
      with:
        script: |
          const marker = '<!-- android-preview-comment -->';
          const prNumber = context.issue.number;
          const previewUrl = process.env.preview_url || '';
          const body = `${marker}\n**Android App Preview**\n\n${previewUrl || 'Preview URL unavailable — check workflow logs.'}\n\nCommit: ${process.env.GITHUB_SHA}\n`;
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
          }
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - reopened
    - synchronize
    branches:
    - master
    - beta
    paths:
    - apps/mobile/**
    - packages/**
    - .github/workflows/android.preview.firebase.yml
